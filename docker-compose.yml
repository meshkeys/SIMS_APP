# Local development infrastructure for SIMS.
# Start everything with `npm run infra:up`. Values come from the root .env
# (copy .env.example), with safe local defaults.
# Object storage (S3-compatible) is added with the documents module.

name: sims

services:
  postgres:
    image: postgres:16
    container_name: sims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sims}
      # Used by the init script to create the least-privileged app role.
      APP_DB_USER: ${APP_DB_USER:-sims_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-sims_app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sims-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sims}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sims-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sims-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: sims-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  sims-pgdata:
  sims-redisdata:
